<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Répertoire de recettes culinaires français traditionnels">
  <title>Dans les cerisiers - Recettes culinaires</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <header>
    <h1>Dans les cerisiers</h1>
    <nav>
      <a href="./">Accueil</a>
      <a href="./recettes/">Recettes</a>
      <a href="./carte/">Adresses</a>
      <a href="./a-propos/">À propos</a>
    </nav>
  </header>

  <main>

    <h2 class="page-title">Répertoire de recettes</h2>

    <!-- Les recettes JSON seront injectées ici -->
    <section id="recettes"></section>
    
  </main>

  <footer>
    <img 
      src="./assets/images/logo.png"
      alt="Logo Dans les cerisiers"
      class="footer-logo"
    >
    <p>&copy; 2026 Dans les cerisiers. Tous droits réservés.</p>
  </footer>

  <!-- Script pour charger les recettes JSON -->
  <script>
    fetch('recettes.json')
      .then(response => response.json())
      .then(recettes => {
        const container = document.getElementById('recettes');

        recettes.forEach(recette => {
          const article = document.createElement('article');
          article.className = 'recipe-card';

          const titre = document.createElement('h3');
          titre.className = 'recipe-title';
          titre.textContent = recette.titre;

          const description = document.createElement('p');
          description.className = 'recipe-description';
          description.textContent = recette.description;
         
          const categorie = document.createElement('p');
          categorie.className = 'recipe-category';
          categorie.textContent = recette.categorie;

          const etapesTitre = document.createElement('h4');
          etapesTitre.textContent = 'Préparation';

          const listeEtapes = document.createElement('ol');
          listeEtapes.className = 'recipe-steps';

          recette.etapes.forEach(etape => {
            const li = document.createElement('li');
            li.innerHTML = etape; // garde les <strong>
            listeEtapes.appendChild(li);
          });

          article.appendChild(titre);
          article.appendChild(description);
          article.appendChild(categorie);
          article.appendChild(etapesTitre);
          article.appendChild(listeEtapes);

          container.appendChild(article);
        });
      });
  </script>

</body>
</html>
