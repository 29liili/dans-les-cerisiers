<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Répertoire de recettes">
  <title>Dans les cerisiers - Recettes culinaires</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <header>
    <h1>Dans les cerisiers</h1>
    <nav>
      <a href="./">Accueil</a>
      <a href="./recettes/">Recettes</a>
      <a href="./carte/">Adresses</a>
      <a href="./a-propos/">À propos</a>
    </nav>
  </header>

  <main>

    <h2 class="page-title">🍒🍒🍒🍒🍒</h2>

<!-- Galerie Instagram -->
<section class="instagram-section">
  <h3 class="section-title">Sur Instagram</h3>

  <div class="instagram-gallery">
    <!-- Colle ici ton widget LightWidget ou SnapWidget -->
    <iframe src="https://cdn.lightwidget.com/widgets/TON_WIDGET_ID.html"
            scrolling="no"
            allowtransparency="true"
            class="lightwidget-widget"></iframe>
  </div>
</section>

<!-- Dernières recettes -->
<section class="latest-recipes">
  <h3 class="section-title">Dernières recettes</h3>
  <div id="latest-recipes-grid" class="recipes-grid"></div>
</section>

  </main>

  <footer>
    <img 
      src="./assets/images/logo.png"
      alt="Logo Dans les cerisiers"
      class="footer-logo"
    >
    <p>&copy; 2026 Dans les cerisiers. Tous droits réservés.</p>
  </footer>

  <!-- Script pour charger les recettes JSON -->
  <script>
    fetch('recettes.json')
  .then(res => res.json())
  .then(recettes => {

    // Trier par ID (Date.now)
    const latest = recettes
      .sort((a, b) => b.id - a.id)
      .slice(0, 3);

    const grid = document.getElementById('latest-recipes-grid');

    latest.forEach(r => {
      const card = document.createElement('article');
      card.className = 'recipe-card';

      const img = document.createElement('img');
      img.src = r.image;
      img.className = 'recipe-thumb';

      const title = document.createElement('h4');
      title.textContent = r.titre;
      title.style.fontFamily = 'Ballet, cursive';

      const cat = document.createElement('span');
      cat.className = 'recipe-category ' + r.categorie;
      cat.textContent = r.categorie;

      card.appendChild(img);
      card.appendChild(title);
      card.appendChild(cat);

      grid.appendChild(card);
    });
  });
  </script>

</body>
</html>
