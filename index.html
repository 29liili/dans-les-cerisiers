<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Répertoire de recettes">
  <title>Dans les cerisiers - Recettes culinaires</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <header>
    <h1>Dans les cerisiers</h1>
    <nav>
      <a href="./">Accueil</a>
      <a href="./recettes/">Recettes</a>
      <a href="./carte/">Adresses</a>
      <a href="./a-propos/">À propos</a>
    </nav>
  </header>

  <main>

    <h2 class="page-title">Accueil</h2>

    <section class="latest-recipes">
      <h3>Dernières recettes:</h3>

      <div id="latest-recipes-grid" class="recipes-grid"></div>

      <a href="./recettes/index.html" class="see-all-btn">
        Toutes les recettes →
      </a>
    </section>

    <!-- Section des dernières adresses coup de coeur -->
    <section class="latest-addresses">
      <h3>Nouvelles adresses favorites: </h3>

      <div id="latest-addresses-grid" class="recipes-grid"></div>

      <a href="./carte/index.html" class="see-all-btn">
        Toutes les adresses →
      </a>
    </section>

  </main>

  <footer>
  <img 
    src="/dans-les-cerisiers/assets/images/logo.png"
    alt="Logo Dans les cerisiers"
    class="footer-logo"
  >
  <p>&copy; 2026 Dans les cerisiers. Tous droits réservés.</p>
</footer>


  <!-- Script pour charger les recettes JSON -->
  <script>
    fetch('recettes.json')
  .then(res => res.json())
  .then(recettes => {

    // Les trois dernières recettes publiées
    const latest = recettes.slice(-3);

    const grid = document.getElementById('latest-recipes-grid');

    latest.forEach(r => {
      const card = document.createElement('article');
      card.className = 'recipe-card';

      const img = document.createElement('img');
      img.src = r.image;
      img.className = 'recipe-thumb';

      const title = document.createElement('h4');
      title.textContent = r.titre;
      title.style.fontFamily = 'Ballet, cursive';
      title.style.fontSize = '1.25rem';

      const cat = document.createElement('span');
      cat.className = 'recipe-category ' + r.categorie;
      cat.textContent = r.categorie;

      card.appendChild(img);
      card.appendChild(title);
      card.appendChild(cat);

      // rendre la carte cliquable
      card.onclick = () => {
        window.location.href = `./recettes/indiv.html?id=${r.id}`;
      };
      card.style.cursor = "pointer";

      grid.appendChild(card);
    });
  });

  </script>

  <!-- Script pour charger les dernières adresses coup de coeur (triées par date, plus récentes d'abord) -->
  <script>
    fetch('./carte/adresses.json')
      .then(res => res.json())
      .then(adresses => {
        // Trier par date décroissante (plus récentes en premier). Si pas de date, on considère 0.
        adresses.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
        const latest = adresses.slice(0, 3);
        const grid = document.getElementById('latest-addresses-grid');
        grid.innerHTML = '';

        latest.forEach(a => {
          const card = document.createElement('article');
          card.className = 'adresse-card';

          const title = document.createElement('h4');
          title.textContent = a.nom;
          title.style.fontFamily = 'Ballet, cursive';
          title.style.fontSize = '1.1rem';

          const addr = document.createElement('p');
          addr.textContent = a.adresse;
          addr.className = 'recipe-description';

          const type = document.createElement('span');
          type.className = 'recipe-category ' + (a.type ? a.type.replace(/\s+/g, '-').toLowerCase() : 'adresse');
          type.textContent = a.type || '';

          const mapsLink = document.createElement('a');
          mapsLink.href = `https://www.google.com/maps/search/${encodeURIComponent(a.adresse)}/@${a.lat},${a.lng},15z`;
          mapsLink.target = '_blank';
          mapsLink.className = 'see-all-btn';
          mapsLink.textContent = 'Voir sur Google Maps';

          // Date affichée optionnelle
          let dateEl = null;
          if (a.date) {
            dateEl = document.createElement('div');
            dateEl.className = 'recipe-description';
            const d = new Date(a.date);
            // format local FR court
            dateEl.textContent = `Trouvée le ${d.toLocaleDateString('fr-FR')}`;
          }

          card.appendChild(title);
          card.appendChild(addr);
          if (dateEl) card.appendChild(dateEl);
          card.appendChild(type);
          card.appendChild(mapsLink);

          // rendre la carte cliquable vers la page d'adresses (avec un #id pour repérer)
          card.addEventListener('click', (e) => {
            if (e.target === mapsLink) return;
            window.location.href = `./carte/index.html#id=${a.id}`;
          });
          card.style.cursor = 'pointer';

          grid.appendChild(card);
        });
      })
      .catch(err => {
        console.warn('Impossible de charger les adresses:', err);
      });
  </script>

</body>
</html>
