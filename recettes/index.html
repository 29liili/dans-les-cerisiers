<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Toutes les recettes du site Dans les cerisiers">
  <title>Toutes les recettes – Dans les cerisiers</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <header>
    <h1>Dans les cerisiers</h1>
    <nav>
      <a href="../">Accueil</a>
      <a href="./">Recettes</a>
      <a href="../carte/">Adresses</a>
      <a href="../a-propos/">À propos</a>
    </nav>
  </header>

  <main>

  <h2 class="page-title">Répertoire de recettes</h2>

  <div class="search-and-add">
    <input type="text" id="search" placeholder="Rechercher une recette...">
    <button id="add-recipe-btn" class="add-recipe-btn">+</button>
  </div>

  <!-- Filtres -->
  <div class="filters">
    <button data-cat="all">toutes</button>
    <button data-cat="chaud">chaud</button>
    <button data-cat="froid">froid</button>
    <button data-cat="sucre">sucré</button>
    <button data-cat="base">base</button>
    <button data-cat="sauce">sauce</button>
  </div>

  <!-- Cartes de recettes -->
  <section id="recettes"></section>

</main>
  
<div class="form-overlay" id="form-overlay">

  <div class="add-recipe-form" id="add-recipe-form">
    <button class="close-panel" id="close-panel">×</button>

    <h3>Ajouter une recette</h3>

    <label for="new-title">Titre</label>
    <input type="text" id="new-title">

    <label for="new-image">Image</label>
    <input type="text" id="new-image">

    <label for="new-category">Catégorie</label>
    <select id="new-category">
      <option value="sucre">Sucré</option>
      <option value="sale">Salé</option>
    </select>

    <label for="new-description">Description</label>
    <textarea id="new-description"></textarea>

    <h4>Ingrédients</h4>
    <div id="ingredients-container"></div>
    <button id="add-ingredient-btn" class="add-etape-btn">Ajouter un ingrédient</button>

    <h4>Étapes</h4>
    <div id="etapes-container"></div>
    <button id="add-etape-btn" class="add-etape-btn">Ajouter une étape</button>

    <button type="submit">Publier</button>
  </div>

  <div class="preview-card" id="preview">
    <h3 id="preview-title">Aperçu</h3>
    <img id="preview-image" src="" alt="">
    <p class="recipe-description" id="preview-description"></p>
    <span id="preview-category" class="recipe-category"></span>

    <ul id="preview-ingredients"></ul>
    <ol id="preview-etapes"></ol>
  </div>

</div>

  
  
  <footer>
    <img 
      src="../assets/images/logo.png"
      alt="Logo Dans les cerisiers"
      class="footer-logo"
    >
    <p>&copy; 2026 Dans les cerisiers. Tous droits réservés.</p>
  </footer>

  <!-- SCRIPT COMPLET -->
  <script>

    /* ============================
   FONCTION : Retirer les accents
============================ */
function sansAccents(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/* ============================
   OUVERTURE / FERMETURE PANNEAU FLOTTANT
============================ */
document.getElementById("add-recipe-btn").onclick = () => {
  const overlay = document.getElementById("form-overlay");
  const form = document.getElementById("add-recipe-form");
  const preview = document.getElementById("preview");

  const isOpen = overlay.classList.contains("show");

  if (!isOpen) {
    form.style.display = "block";
    preview.style.display = "block";

    overlay.classList.add("show");
    document.body.classList.add("modal-open");
  } else {
    overlay.classList.remove("show");
    document.body.classList.remove("modal-open");

    setTimeout(() => {
      form.style.display = "none";
      preview.style.display = "none";
    }, 350);
  }
};

/* Bouton de fermeture */
document.getElementById("close-panel").onclick = () => {
  const overlay = document.getElementById("form-overlay");
  const form = document.getElementById("add-recipe-form");
  const preview = document.getElementById("preview");

  overlay.classList.remove("show");
  document.body.classList.remove("modal-open");

  setTimeout(() => {
    form.style.display = "none";
    preview.style.display = "none";
  }, 350);
};

/* ============================
   AJOUT INGREDIENTS / ETAPES
============================ */
document.getElementById("add-ingredient-btn").onclick = () => {
  const container = document.getElementById("ingredients-container");
  const row = document.createElement("div");
  row.className = "ingredient-row";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "ingredient-input";
  input.placeholder = "Ingrédient";

  const del = document.createElement("button");
  del.type = "button";
  del.className = "delete-btn";
  del.textContent = "🗑";
  del.onclick = () => row.remove();

  row.appendChild(input);
  row.appendChild(del);
  container.appendChild(row);

  updatePreview();
};

document.getElementById("add-etape-btn").onclick = () => {
  const container = document.getElementById("etapes-container");
  const row = document.createElement("div");
  row.className = "etape-row";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "etape-input";
  input.placeholder = "Étape";

  const del = document.createElement("button");
  del.type = "button";
  del.className = "delete-btn";
  del.textContent = "🗑";
  del.onclick = () => row.remove();

  row.appendChild(input);
  row.appendChild(del);
  container.appendChild(row);

  updatePreview();
};

/* ============================
   PRÉVISUALISATION
============================ */
function updatePreview() {
  const preview = document.getElementById("preview");
  preview.style.display = "block";

  document.getElementById("preview-title").textContent =
    document.getElementById("new-title").value;

  const cat = document.getElementById("new-category").value;
  const catEl = document.getElementById("preview-category");
  catEl.textContent = cat;
  catEl.className = "recipe-category " + cat;

  const imgUrl = document.getElementById("new-image").value;
  const imgEl = document.getElementById("preview-image");
  imgEl.src = imgUrl || "";
  imgEl.style.display = imgUrl ? "block" : "none";

  const ingList = document.getElementById("preview-ingredients");
  ingList.innerHTML = "";
  document.querySelectorAll(".ingredient-input").forEach(i => {
    const li = document.createElement("li");
    li.innerHTML = `<strong>${i.value}</strong>`;
    ingList.appendChild(li);
  });

  const etList = document.getElementById("preview-etapes");
  etList.innerHTML = "";
  document.querySelectorAll(".etape-input").forEach(e => {
    const li = document.createElement("li");
    li.textContent = e.value;
    etList.appendChild(li);
  });
}

document.querySelectorAll("#add-recipe-form input, #add-recipe-form textarea, #add-recipe-form select")
  .forEach(el => el.addEventListener("input", updatePreview));

/* ============================
   EXPORT JSON
============================ */
document.getElementById("add-recipe-form").onsubmit = (e) => {
  e.preventDefault();

  const recette = {
    id: Date.now(),
    titre: document.getElementById("new-title").value,
    categorie: document.getElementById("new-category").value,
    description: document.getElementById("new-description").value,
    image: document.getElementById("new-image").value,
    ingredients: Array.from(document.querySelectorAll(".ingredient-input"))
      .map(i => `<strong>${i.value.trim()}</strong>`),
    etapes: Array.from(document.querySelectorAll(".etape-input"))
      .map(e => e.value.trim())
  };

  const blob = new Blob([JSON.stringify(recette, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "nouvelle-recette.json";
  a.click();
};

/* ============================
   AFFICHAGE DES RECETTES
============================ */
fetch('../recettes.json')
  .then(response => response.json())
  .then(recettes => {

    const container = document.getElementById('recettes');
    const buttons = document.querySelectorAll('.filters button');
    const searchInput = document.getElementById('search');

    function afficherRecettes(categorie) {
      container.innerHTML = '';

      const liste = recettes.filter(r => categorie === 'all' || r.categorie === categorie);

      if (liste.length === 0) {
        container.innerHTML = '<p class="no-recipes">Aucune recette dans cette catégorie.</p>';
        return;
      }

      liste.forEach(recette => {
        const article = document.createElement('article');
        article.className = 'recipe-card';

        const titre = document.createElement('h3');
        titre.className = 'recipe-title';

        const lien = document.createElement('a');
        lien.href = `indiv.html?id=${recette.id}`;
        lien.textContent = recette.titre;
        titre.appendChild(lien);

        const description = document.createElement('p');
        description.className = 'recipe-description';
        description.textContent = recette.description;

        const categorieElement = document.createElement('span');
        categorieElement.className = 'recipe-category';
        categorieElement.textContent = recette.categorie;
        categorieElement.classList.add(recette.categorie);

        article.appendChild(titre);
        article.appendChild(description);
        article.appendChild(categorieElement);

        container.appendChild(article);
      });
    }

    afficherRecettes('all');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        afficherRecettes(btn.dataset.cat);
      });
    });

    searchInput.addEventListener('input', () => {
      const query = sansAccents(searchInput.value.toLowerCase());
      const articles = document.querySelectorAll('#recettes article');

      articles.forEach(article => {
        const titre = sansAccents(article.querySelector('.recipe-title').textContent.toLowerCase());
        const description = sansAccents(article.querySelector('.recipe-description').textContent.toLowerCase());

        const match = titre.includes(query) || description.includes(query);

        article.style.display = match ? '' : 'none';
      });
    });

  });
  </script>

</body>
</html>
