 <script>

/* ============================
   Retirer les accents
============================ */
function sansAccents(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/* ============================
   Convertir *gras* → <strong>
============================ */
function convertStarsToBold(text) {
  return text.replace(/\*(.*?)\*/g, "<strong>$1</strong>");
}

/* ============================
   OUVERTURE / FERMETURE PANNEAU
============================ */
document.getElementById("add-recipe-btn").onclick = () => {
  const overlay = document.getElementById("form-overlay");
  const form = document.getElementById("add-recipe-form");
  const preview = document.getElementById("preview");

  const isOpen = overlay.classList.contains("show");

  if (!isOpen) {
    form.style.display = "block";
    preview.style.display = "block";
    overlay.classList.add("show");
    document.body.classList.add("modal-open");
  } else {
    overlay.classList.remove("show");
    document.body.classList.remove("modal-open");
    setTimeout(() => {
      form.style.display = "none";
      preview.style.display = "none";
    }, 350);
  }
};

document.getElementById("close-panel").onclick = () => {
  const overlay = document.getElementById("form-overlay");
  const form = document.getElementById("add-recipe-form");
  const preview = document.getElementById("preview");

  overlay.classList.remove("show");
  document.body.classList.remove("modal-open");

  setTimeout(() => {
    form.style.display = "none";
    preview.style.display = "none";
  }, 350);
};

/* ============================
   AJOUT D'ÉTAPES
============================ */
document.getElementById("add-etape-btn").onclick = () => {
  const container = document.getElementById("etapes-container");
  const row = document.createElement("div");
  row.className = "etape-row";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "etape-input";
  input.placeholder = "Étape";

  const del = document.createElement("button");
  del.type = "button";
  del.className = "delete-btn";
  del.textContent = "🗑";
  del.onclick = () => row.remove();

  row.appendChild(input);
  row.appendChild(del);
  container.appendChild(row);

  updatePreview();
};
