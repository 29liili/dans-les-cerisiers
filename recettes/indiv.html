<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recette détaillée – Dans les cerisiers">
  <title>Recette – Dans les cerisiers</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <header>
    <h1>Dans les cerisiers</h1>
    <nav>
      <a href="../">Accueil</a>
      <a href="./">Recettes</a>
      <a href="../carte/">Adresses</a>
      <a href="../a-propos/">À propos</a>
    </nav>
  </header>

  <main id="recette-container">
    <a href="./" class="back-button">← Retour</a>

    <h2 id="recette-titre" class="page-title"></h2>

    <p id="recette-categorie" class="recipe-category"></p>
    <p id="recette-description" class="recipe-description"></p>
    <img id="recette-image" class="recipe-thumb" alt="Image de la recette">
    <ol id="recette-etapes" class="recipe-steps"></ol>


  </main>

  <footer>
    <img 
      src="../assets/images/logo.png"
      alt="Logo Dans les cerisiers"
      class="footer-logo"
    >
    <p>&copy; 2026 Dans les cerisiers. Tous droits réservés.</p>
  </footer>

  <script>
    // Récupération de l'ID dans l'URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    fetch('../recettes.json')
      .then(response => response.json())
      .then(recettes => {

        const recette = recettes.find(r => r.id === id);

        if (!recette) {
          document.getElementById("recette-container").innerHTML =
            "<p>Recette introuvable.</p>";
          return;
        }

        // Remplissage des éléments
        document.getElementById("recette-titre").textContent = recette.titre;
        
        // Catégorie
        const categorieElement = document.getElementById("recette-categorie");
        categorieElement.textContent = recette.categorie;
        categorieElement.classList.add(recette.categorie);

  

        // Image
        const img = document.getElementById("recette-image");
        img.src = recette.image;
        img.alt = recette.titre;

        // Description
        document.getElementById("recette-description").textContent =
          recette.description;

        // Étapes
        const etapesList = document.getElementById("recette-etapes");
        recette.etapes.forEach(etape => {
        const li = document.createElement("li");
        li.innerHTML = etape;   // <-- CORRECTION ICI
        etapesList.appendChild(li);


        });

      });
  </script>

</body>
</html>
