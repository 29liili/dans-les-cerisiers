<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recette – Dans les cerisiers</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <header>
    <h1>Dans les cerisiers</h1>
    <nav>
      <a href="../">Accueil</a>
      <a href="./">Recettes</a>
      <a href="../carte/">Adresses</a>
      <a href="../a-propos/">À propos</a>
    </nav>
  </header>

  <main>
    <section id="recette" class="recette-container"></section>
  </main>

  <footer>
    <img src="../assets/images/logo.png" alt="Logo Dans les cerisiers" class="footer-logo">
    <p>&copy; 2026 Dans les cerisiers. Tous droits réservés.</p>
  </footer>

  <script>
    // Récupère l'ID dans l'URL : ?id=flan-patissier
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    fetch('../recettes.json')
      .then(response => response.json())
      .then(recettes => {
        const recette = recettes.find(r => r.id === id);
        const container = document.getElementById('recette');

        if (!recette) {
          container.innerHTML = "<p class='no-recipes'>Recette introuvable.</p>";
          return;
        }

        const article = document.createElement('article');
        article.className = 'recipe-card';

        /* IMAGE EN HAUT */
        if (recette.image) {
          const img = document.createElement('img');
          img.src = recette.image;
          img.alt = recette.titre;
          img.className = 'recipe-image';
          article.appendChild(img);
        }

        /* TITRE */
        const titre = document.createElement('h2');
        titre.className = 'recipe-title';
        titre.textContent = recette.titre;

        /* CATÉGORIE */
        const categorie = document.createElement('p');
        categorie.className = 'recipe-category';
        categorie.textContent = recette.categorie;

        /* DESCRIPTION */
        const description = document.createElement('p');
        description.className = 'recipe-description';
        description.textContent = recette.description;

        /* TITRE ÉTAPES */
        const etapesTitre = document.createElement('h3');
        etapesTitre.textContent = "Préparation";

        /* LISTE DES ÉTAPES */
        const listeEtapes = document.createElement('ol');
        listeEtapes.className = 'recipe-steps';

        recette.etapes.forEach(etape => {
          const li = document.createElement('li');
          li.innerHTML = etape;
          listeEtapes.appendChild(li);
        });

        /* BOUTON RETOUR */
        const retour = document.createElement('a');
        retour.href = "./";
        retour.className = "btn";
        retour.textContent = "← Retour aux recettes";

        /* ASSEMBLAGE */
        article.appendChild(titre);
        article.appendChild(categorie);
        article.appendChild(description);
        article.appendChild(etapesTitre);
        article.appendChild(listeEtapes);
        article.appendChild(retour);

        container.appendChild(article);
      });
  </script>

</body>
</html>
